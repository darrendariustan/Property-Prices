services:
  - type: web
    name: paris-property-price
    env: python
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: streamlit run apartment_price_estimator.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
    plan: free 